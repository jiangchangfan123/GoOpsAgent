# GoOpsAgent 默认配置
# 实际运行时可通过环境变量覆盖

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 10s

database:
  dsn: "postgres://postgres:postgres@localhost:5432/goopsagent?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

llm:
  api_key: ""       # 通过环境变量设置
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-plus"
  timeout: 60s
  max_tokens: 4096

agent:
  max_iterations: 10
  max_tool_calls: 20
  task_timeout: 300s
  tool_timeout: 30s

kubernetes:
  kubeconfig: ""    # 空表示使用 in-cluster 配置
  namespace_whitelist:
    - default

redis:
  addr: "localhost:6379"
  password: ""

log:
  level: "info"
  format: "json"    # json 或 text